<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Achadinhos do Doutor Curioso</title>
<style>
 :root{--bg:#f3effc;--fg:#1d1530;--card:#fff;--lar:#ff6e1e;--sub:#5b5170}
 @media (prefers-color-scheme:dark){:root{--bg:#151020;--fg:#f3effc;--card:#231a35;--sub:#b9b0cc}}
 body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
 main{max-width:520px;margin:0 auto;padding:28px 16px 48px}
 h1{font-size:1.5rem;margin:0 0 4px;text-align:center} p.t{text-align:center;color:var(--sub);margin:0 0 22px}
 .card{display:block;background:var(--card);border-radius:18px;padding:16px 18px;margin:0 0 14px;text-decoration:none;color:var(--fg);
       border:3px solid var(--lar);box-shadow:0 4px 14px rgba(0,0,0,.08)}
 .nome{display:block;font-weight:800;font-size:1.1rem} .sub{display:block;color:var(--sub);margin:4px 0 12px}
 .btn{display:inline-block;background:var(--lar);color:#fff;font-weight:700;border-radius:999px;padding:8px 16px}
 .aviso,.vazio{font-size:.85rem;color:var(--sub);text-align:center;margin-top:20px}
</style></head>
<body><main>
 <h1>Achadinhos do Doutor Curioso</h1>
 <p class="t">Os produtos que aparecem nos vídeos do @arquivo.oculto.curiosidades</p>
  <p class="vazio">Em breve os achadinhos dos vídeos aparecem aqui.</p>
 <p class="aviso">#publi: são links de afiliado. Se você comprar por eles, o canal pode ganhar uma comissão, sem custo extra para você.</p>
</main></body></html>
